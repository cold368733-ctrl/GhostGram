 GhostGram. No tienen valor monetario y no se pueden cambiar por dinero real.", "Los ataúdes comprados no se reembolsan. Se acreditan manualmente tras el pago por Telegram.", "Al vender una reliquia en el mercado se cobra una comisión de aproximadamente el 10 % del precio; el resto lo recibe el vendedor.", "Los cofres dan un premio aleatorio; las probabilidades se muestran en el propio cofre.", "Hacer trampas, duplicar o intentar engañar la economía de la app está prohibido y se castiga con un ban.", "Los precios y el contenido de la tienda y los cofres pueden cambiar.", "GhostGram es un proyecto independiente y no está afiliado a Rockstar Games ni a Take-Two Interactive. Los nombres de juegos se mencionan solo como homenaje."]}, "de": {"intro": "GhostGram ist ein gotischer Messenger für Geister: Chats, Kanäle, Geschenke und Sammel-Reliquien in einer App.", "fT": "Version 1.0.0 – erste Veröffentlichung", "f": ["Anmeldung mit Google-Konto", "Geister per Benutzernamen finden und privat in Echtzeit chatten, mit den Status „schreibt“ und „kürzlich hier“", "Text, Fotos, Dateien (bis 500 KB) und Sprachnachrichten", "Angeheftete Chats und Archiv", "Kanäle: erstelle deinen eigenen und lies andere", "Profile: Avatar aus der Galerie oder ein Geist deiner Wahl, Name und Benutzername änderbar", "Geschenke und Sammel-Reliquien", "Währung „Särge“: Reliquienladen, Kisten und Markt sowie „Sarg“-Reaktionen, um dem Autor einer Nachricht oder dem Kanalbesitzer zu danken", "Verifizierte Geister mit besonderem Abzeichen", "Vollmondmodus, Schreck-Geräusche und Vibration", "6 Sprachen: Русский, English, Қазақша, Español, Deutsch, Türkçe", "Auf dem Startbildschirm installierbar wie eine normale App"], "rT": "Friedhofsregeln", "rI": "Hier gibt es fast keine Regeln: schreibe, was du willst, und sei du selbst. Aber manches ist streng verboten:", "r": ["Pornografie und jegliche explizite 18+-Inhalte", "Drogen: Verkauf, Werbung, wo man sie kauft oder wie man sie herstellt", "Jegliche sexuellen /* --- запись голосового (для публикации в канале): держи = запись, отпусти = отправить, свайп влево = отмена --- */

  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(x){if(rec===r)rec=null;toast(t('micDenied'));return}
  if(rec!==r||r.rel){stream.getTracks().forEach(k=>k.stop());if(rec===r)rec=null;return}

  mr.onstop=()=>{stream.getTracks().forEach(k=>k.stop());const sec=(Date.now()-r.t0)/1e3;if(!r.sendIt)return;if(sec<.8){toast(t('holdMic'));return}o.done(new Blob(ch,{type:'audio/'+ext}),Math.round(sec),ext)};
  r.t0=Date.now();mr.start(1000);o.ui(true);if(S.vib&&navigator.vibrate)navigator.vibrate(30);
  r.iv=setInterval(()=>o.tick((Date.now()-r.t0)/1e3),250);r.lim=setTimeout(()=>stop(true),120000)});

   Версия SDK = как в основном модуле (10.14.1). Экземпляр приложения берётся через getApp(). */
import{getApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,collection,query,where,onSnapshot,serverTimestamp,writeBatch,increment}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const fapp=getApp(),auth=getAuth(fapp),db=getFirestore(fapp);

/* ---- настройки ---- */
const RING_MS=45000;    // сколько звонящий ждёт ответа
const STALE_MS=60000;   // звонок старше этого при открытии приложения = «пропущенный»
const CONNECT_MS=25000; // сколько ждём установки соединения после «принять»
const ICE={iceServers:[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'}
  /* ---- TURN (нужен для звонков по мобильному интернету / строгим NAT) ----
     Раскомментируй строку ниже (не забудь запятую в строке выше после stun1)
     и впиши СВОИ данные от TURN-провайдера (например, бесплатный аккаунт на metered.ca
     или свой coturn): хост, логин и пароль.
  ,{urls:['turn:ВПИШИ_ХОСТ:3478','turn:ВПИШИ_ХОСТ:443?transport=tcp','turns:ВПИШИ_ХОСТ:443?transport=tcp'],username:'ВПИШИ_ЛОГИН',credential:'ВПИШИ_ПАРОЛЬ'}
  */
]};

/* ---- мелкие помощники ---- */
const el=(t,p={},...k)=>{const e=document.createElement(t);for(const a in p){if(a==='class')e.className=p[a];else if(a.startsWith('on'))e.addEventListener(a.slice(2),p[a]);else e.setAttribute(a,p[a])}k.flat().forEach(c=>{if(c!=null)e.append(c)});return e};
const toast=m=>{const e=el('div',{class:'toast'},m);document.body.append(e);setTimeout(()=>e.remove(),3000)};
const pad=n=>String(n).padStart(2,'0');
const fmt=sec=>pad(Math.floor(sec/60))+':'+pad(sec%60);
const micErr=e=>{const n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError')return'Нет доступа к микрофону. Разреши его в настройках браузера';
  if(n==='NotFoundError'||n==='OverconstrainedError')return'Микрофон не найден';
  if(n==='NotReadableError')return'Микрофон занят другим приложением';
  return'Не удалось включить микрофон'};
const getMic=()=>{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return Promise.reject({name:'NotFoundError'});
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})};
const stopStream=st=>{try{st&&st.getTracks().forEach(t=>t.stop())}catch(e){}};
async function nameOf(u){try{const s=await getDoc(doc(db,'users',u));if(s.exists()){const d=s.data();return d.displayName||d.handle||'Призрак'}}catch(e){}return'Призрак'}

/* ---- стили (под готический дизайн приложения) ---- */

document.head.append(css);

/* ---- рингтон (WebAudio, без файлов) ---- */
let ringT=null,rctx=null;
function ringStart(){ringStop();
  const tick=()=>{try{rctx=rctx||new(window.AudioContext||window.webkitAudioContext)();if(rctx.state==='suspended')rctx.resume();
    [0,.28].forEach((d,i)=>{const o=rctx.createOscillator(),g=rctx.createGain(),t=rctx.currentTime+d;o.type='sine';o.frequency.value=i?560:440;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.24);
      o.connect(g);g.connect(rctx.destination);o.start(t);o.stop(t+.26)})}catch(e){}
    try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}};
  tick();ringT=setInterval(tick,2200)}
function ringStop(){if(ringT){clearInterval(ringT);ringT=null}try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}

/* ---- состояние ---- */
let uid=null,cur=null,unsubIn=null;
const seen=new Set();

const newSession=(role,peerUid,peerName,chatId)=>({role,peerUid,peerName,chatId,id:null,status:'init',pc:null,stream:null,audio:null,
  candQ:[],remoteQ:[],callReady:false,remoteSet:false,answerSet:false,done:false,msgDone:false,accepting:false,
  connectedAt:0,ui:null,unsubDoc:null,unsubCand:null,ringTimer:0,discT:0,connT:0,tickT:0,wake:null});

/* ---- экран звонка ---- */
function buildUi(s){
  const incoming=s.role==='callee';
  const ov=el('div',{class:'gc-ov'+(incoming?' ring':'')});
  const av=el('div',{class:'gc-av'},((s.peerName||'').trim().charAt(0)||'👻').toUpperCase());
  const nm=el('div',{class:'gc-nm'},s.peerName||'Призрак');
  const st=el('div',{class:'gc-st'}),tm=el('div',{class:'gc-tm'}),hint=el('div',{class:'gc-hint'});
  const btns=el('div',{class:'gc-btns'});
  ov.append(el('div',{class:'gc-top'},av,nm,st,tm,hint),btns);
  const mk=(cls,ico,label,fn)=>el('div',{class:'gc-bw'},el('button',{class:'gc-b '+cls,onclick:fn,'aria-label':label},ico),label);
  const ui={
    setState:t=>{st.textContent=t||''},
    setTime:t=>{tm.textContent=t||''},
    hint:t=>{hint.textContent=t||''},
    ring:on=>ov.classList.toggle('ring',!!on),
    mode:m=>{btns.replaceChildren();
      if(m==='incoming'){
        btns.append(mk('end','✕','Отклонить',()=>hangup(s)),mk('ok','📞','Принять',()=>acceptCall(s)))
      }else{
        const mute=mk('','🎙','Микрофон',ev=>{const b=ev.currentTarget;const off=!b.classList.contains('on');
          if(s.stream)s.stream.getAudioTracks().forEach(t=>t.enabled=!off);b.classList.toggle('on',off);b.textContent=off?'🔇':'🎙'});
        btns.append(mute,mk('end','✕','Завершить',()=>hangup(s)))
      }},
    close:()=>{ov.remove()}
  };
  ov.addEventListener('click',()=>{if(s.audio&&s.audio.paused&&s.audio.srcObject){s.audio.play().then(()=>ui.hint('')).catch(()=>{})}});
  ui.mode(incoming?'incoming':'active');
  document.body.append(ov);
  return ui;
}

/* ---- WebRTC ---- */
function makePc(s){
  const pc=new RTCPeerConnection(ICE);s.pc=pc;
  s.audio=el('audio',{playsinline:'',style:'display:none'});s.audio.autoplay=true;document.body.append(s.audio);
  s.stream.getTracks().forEach(t=>pc.addTrack(t,s.stream));
  pc.ontrack=ev=>{if(s.done)return;s.audio.srcObject=ev.streams&&ev.streams[0]?ev.streams[0]:new MediaStream([ev.track]);
    s.audio.play().catch(()=>{s.ui&&s.ui.hint('Нажми на экран, чтобы включить звук')})};
  pc.onicecandidate=ev=>{if(ev.candidate)sendCand(s,ev.candidate)};
  pc.onconnectionstatechange=()=>{
    if(s.done)return;const c=pc.connectionState;
    if(c==='connected'){
      clearTimeout(s.discT);clearTimeout(s.connT);
      if(!s.connectedAt){s.connectedAt=Date.now();s.ui.ring(false);s.ui.setState('Разговор');s.ui.setTime('00:00');
        s.tickT=setInterval(()=>s.ui.setTime(fmt(Math.round((Date.now()-s.connectedAt)/1000))),1000);
        try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>{if(s.done)w.release().catch(()=>{});else s.wake=w}).catch(()=>{})}catch(e){}}
      else s.ui.setState('Разговор');
    }else if(c==='disconnected'){
      s.ui.setState('Связь прерывается…');clearTimeout(s.discT);
      s.discT=setTimeout(()=>{if(!s.done&&pc.connectionState!=='connected')failCall(s)},10000);
    }else if(c==='failed'){failCall(s)}
  };
}
function failCall(s){if(s.done)return;toast('Не удалось соединиться. По мобильному интернету может понадобиться TURN');hangup(s)}

function sendCand(s,c){
  if(s.done)return;
  if(!s.callReady){s.candQ.push(c);return}
  addDoc(collection(db,'calls',s.id,'candidates'),{from:uid,c:JSON.stringify(c.toJSON?c.toJSON():c)}).catch(()=>{});
}
function flushCand(s){s.callReady=true;s.candQ.splice(0).forEach(c=>sendCand(s,c))}
function flushRemote(s){s.remoteSet=true;s.remoteQ.splice(0).forEach(c=>s.pc.addIceCandidate(c).catch(()=>{}))}

function listenCands(s){
  s.unsubCand=onSnapshot(collection(db,'calls',s.id,'candidates'),snap=>{
    if(s.done)return;
    snap.docChanges().forEach(ch=>{
      if(ch.type!=='added')return;const d=ch.doc.data();if(d.from===uid)return;
      let c;try{c=JSON.parse(d.c)}catch(e){return}
      if(s.remoteSet)s.pc.addIceCandidate(c).catch(()=>{});else s.remoteQ.push(c);
    });
  },()=>{});
}
function listenDoc(s){
  s.unsubDoc=onSnapshot(doc(db,'calls',s.id),snap=>{if(snap.exists())onCallUpdate(s,snap.data())},()=>{});
}

/* ---- сообщение о звонке в чат (пишет звонящий, поля строго по правилам) ---- */
function durText(s){const sec=s.connectedAt?Math.max(0,Math.round((Date.now()-s.connectedAt)/1000)):0;return'📞 Звонок · '+fmt(sec)}
function writeCallMsg(s,text){
  if(s.msgDone||s.role!=='caller')return;s.msgDone=true;
  try{
    const b=writeBatch(db),cref=doc(db,'chats',s.chatId),mr=doc(collection(db,'chats',s.chatId,'messages'));
    b.set(mr,{from:uid,text,createdAt:serverTimestamp()});
    b.update(cref,{lastMessage:text.slice(0,60),lastAt:serverTimestamp(),lastFrom:uid,['unread.'+s.peerUid]:increment(1)});
    b.commit().catch(e=>console.warn('call msg',e));
  }catch(e){console.warn('call msg',e)}
}

/* ---- обработка изменений документа звонка ---- */
function onCallUpdate(s,d){
  if(s.done)return;
  const st=d.status;
  if(st==='ringing')return;
  if(st==='accepted'){
    s.status='accepted';
    if(s.role==='caller'&&!s.answerSet&&d.answer){
      s.answerSet=true;clearTimeout(s.ringTimer);s.ui.setState('Соединяем…');
      s.connT=setTimeout(()=>{if(!s.done&&!s.connectedAt)failCall(s)},CONNECT_MS);
      s.pc.setRemoteDescription(d.answer).then(()=>flushRemote(s)).catch(()=>failCall(s));
    }
    return;
  }
  // звонок завершён удалённо: declined | cancelled | missed | ended
  s.status=st;
  if(s.role==='caller'){
    if(st==='declined')writeCallMsg(s,'📞 Звонок отклонён');
    else if(st==='ended')writeCallMsg(s,durText(s));
    else writeCallMsg(s,'📞 Пропущенный звонок');
    toast(st==='declined'?'Звонок отклонён':st==='ended'?'Звонок завершён':'Нет ответа');
  }else toast(st==='ended'?'Звонок завершён':'Пропущенный звонок');
  teardown(s);
}

/* ---- завершение / очистка (без утечек) ---- */
function teardown(s){
  if(s.done)return;s.done=true;
  clearTimeout(s.ringTimer);clearTimeout(s.discT);clearTimeout(s.connT);clearInterval(s.tickT);
  if(cur===s||(cur&&cur.role==='callee'))ringStop();
  try{s.unsubDoc&&s.unsubDoc()}catch(e){}s.unsubDoc=null;
  try{s.unsubCand&&s.unsubCand()}catch(e){}s.unsubCand=null;
  if(s.pc){try{s.pc.ontrack=s.pc.onicecandidate=s.pc.onconnectionstatechange=null;s.pc.close()}catch(e){}s.pc=null}
  stopStream(s.stream);s.stream=null;
  if(s.audio){try{s.audio.pause();s.audio.srcObject=null;s.audio.remove()}catch(e){}s.audio=null}
  if(s.wake){s.wake.release().catch(()=>{});s.wake=null}
  s.candQ.length=0;s.remoteQ.length=0;
  if(s.ui){s.ui.close();s.ui=null}
  if(cur===s)cur=null;
}

function hangup(s){
  if(!s||s.done)return;
  if(s.id){
    const ref=doc(db,'calls',s.id);
    if(s.status==='accepted'){
      updateDoc(ref,{status:'ended',endedAt:serverTimestamp()}).catch(()=>{});
      writeCallMsg(s,durText(s));
    }else if(s.status==='ringing'){
      if(s.role==='caller'){
        updateDoc(ref,{status:'cancelled',endedAt:serverTimestamp()}).catch(()=>{});
        writeCallMsg(s,'📞 Пропущенный звонок');
      }else updateDoc(ref,{status:'declined',endedAt:serverTimestamp()}).catch(()=>{});
    }
  }
  teardown(s);
}

/* ---- исходящий ---- */
async function startCall(peerUid,peerName,chatId){
  if(!uid||!auth.currentUser){toast('Сначала войди в аккаунт');return}
  if(!peerUid||!chatId){toast('Не удалось начать звонок');return}
  if(cur){toast('Ты уже в звонке');return}
  if(!window.RTCPeerConnection){toast('Этот браузер не поддерживает звонки');return}
  const s=newSession('caller',peerUid,peerName,chatId);cur=s;
  s.ui=buildUi(s);s.ui.setState('Включаем микрофон…');
  try{
    s.stream=await getMic();
    if(s.done){stopStream(s.stream);s.stream=null;return}
    makePc(s);
    const offer=await s.pc.createOffer();
    if(s.done)return;
    await s.pc.setLocalDescription(offer);
    if(s.done)return;
    const ref=doc(collection(db,'calls'));s.id=ref.id;
    await setDoc(ref,{from:uid,to:peerUid,status:'ringing',createdAt:serverTimestamp(),offer:{type:offer.type,sdp:offer.sdp}});
    if(s.done){ // нажали «завершить» пока создавался звонок
      updateDoc(ref,{status:'cancelled',endedAt:serverTimestamp()}).catch(()=>{});
      return}
    s.status='ringing';
    flushCand(s);listenCands(s);listenDoc(s);
    s.ui.setState('Звоним…');
    s.ringTimer=setTimeout(()=>{
      if(s.done||s.status!=='ringing')return;
      updateDoc(doc(db,'calls',s.id),{status:'missed',endedAt:serverTimestamp()}).catch(()=>{});
      writeCallMsg(s,'📞 Пропущенный звонок');toast('Нет ответа');teardown(s);
    },RING_MS);
  }catch(e){
    if(s.done)return;
    const mic=!s.stream;
    toast(mic?micErr(e):(e&&e.code==='permission-denied'?'Нельзя позвонить этому человеку':'Не удалось начать звонок'));
    teardown(s);
  }
}
window.ghostCall=startCall;

/* ---- входящий ---- */
async function incoming(id,d){
  const ref=doc(db,'calls',id);
  const busy=()=>updateDoc(ref,{status:'declined',endedAt:serverTimestamp()}).catch(()=>{});
  if(cur){busy();return}
  const name=await nameOf(d.from);
  if(cur){busy();return}
  const s=newSession('callee',d.from,name,[uid,d.from].sort().join('_'));
  s.id=id;s.offer=d.offer;s.status='ringing';cur=s;
  s.ui=buildUi(s);s.ui.setState('Входящий звонок…');
  ringStart();listenDoc(s);
  s.ringTimer=setTimeout(()=>{
    if(s.done||s.status!=='ringing')return;
    updateDoc(ref,{status:'missed',endedAt:serverTimestamp()}).catch(()=>{});
    toast('Пропущенный звонок');teardown(s);
  },RING_MS+5000);
}
async function acceptCall(s){
  if(s.done||s.accepting||s.status!=='ringing')return;
  s.accepting=true;ringStop();clearTimeout(s.ringTimer);
  s.ui.ring(false);s.ui.mode('active');s.ui.setState('Включаем микрофон…');
  const ref=doc(db,'calls',s.id);
  try{
    s.stream=await getMic();
    if(s.done){stopStream(s.stream);s.stream=null;return}
  }catch(e){toast(micErr(e));hangup(s);return}
  try{
    makePc(s);listenCands(s);
    await s.pc.setRemoteDescription(s.offer);
    flushRemote(s);
    const ans=await s.pc.createAnswer();
    if(s.done)return;
    await s.pc.setLocalDescription(ans);
    if(s.done)return;
    flushCand(s);
    await updateDoc(ref,{status:'accepted',answer:{type:ans.type,sdp:ans.sdp}});
    if(s.done){updateDoc(ref,{status:'ended',endedAt:serverTimestamp()}).catch(()=>{});return}
    s.status='accepted';s.ui.setState('Соединяем…');
    s.connT=setTimeout(()=>{if(!s.done&&!s.connectedAt)failCall(s)},CONNECT_MS);
  }catch(e){
    if(s.done)return;
    toast('Звонок уже завершён или не удалось ответить');teardown(s);
  }
}

/* ---- плашка «Пропущенный звонок» ---- */
let banBox=null;
async function missedBanner(from){
  const name=await nameOf(from);
  if(!banBox||!banBox.isConnected){banBox=el('div',{class:'gc-bans'});document.body.append(banBox)}
  const b=el('div',{class:'gc-ban'},el('span',{},'📞 Пропущенный звонок · '+name),el('button',{'aria-label':'Закрыть',onclick:()=>b.remove()},'✕'));
  banBox.append(b);setTimeout(()=>b.remove(),15000);
}

/* ---- подписка на входящие (пока приложение открыто) ---- */
function stopWatch(){if(unsubIn){try{unsubIn()}catch(e){}unsubIn=null}}
function watchIncoming(){
  stopWatch();
  unsubIn=onSnapshot(query(collection(db,'calls'),where('to','==',uid),where('status','==','ringing')),snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==='removed')return;
      const id=ch.doc.id;if(seen.has(id))return;seen.add(id);
      const d=ch.doc.data({serverTimestamps:'estimate'});
      const ms=d.createdAt&&d.createdAt.toMillis?d.createdAt.toMillis():Date.now();
      if(Date.now()-ms>STALE_MS){
        missedBanner(d.from);
        updateDoc(ch.doc.ref,{status:'missed',endedAt:serverTimestamp()}).catch(()=>{});
        return}
      incoming(id,d);
    });
  },e=>console.warn('calls watch',e));
}
onAuthStateChanged(auth,u=>{
  const nu=u?u.uid:null;if(nu===uid)return;
  if(cur)hangup(cur);
  stopWatch();uid=nu;seen.clear();
  if(uid)watchIncoming();
});
/* закрыли вкладку/приложение во время звонка — стараемся корректно завершить */
addEventListener('pagehide',()=>{if(cur)hangup(cur)});
</script>
